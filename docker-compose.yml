services:
  backend:
    build:
      context: ./backend
    container_name: spassu_backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.dev
    volumes:
      - ./backend:/app
    command: python manage.py runserver 0.0.0.0:8000
    networks:
      - papelaria_network

  frontend:
    build:
      context: ./frontend
    container_name: spassu_frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env.development
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - papelaria_network

networks:
  papelaria_network:
    driver: bridge